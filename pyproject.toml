[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbrief"
version = "0.2.0"
description = "An insurance claims agent whose memory knows the difference between what you said and what the records say. SurrealDB Agent Memory + deterministic checks in SurrealDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "surrealdb>=2.0",
    "anthropic>=0.40",
    "rich>=13",
]

[project.optional-dependencies]
vectors = ["fastembed>=0.4"]

[project.scripts]
dbrief = "dbrief.game:main"

[tool.setuptools]
packages = ["dbrief"]

[tool.setuptools.package-data]
dbrief = ["ledger.surql", "data/*.json"]
